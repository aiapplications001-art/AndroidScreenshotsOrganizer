      <path d="M14 24 L22 32 L36 16" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="62" y="33" font-size="25" font-weight="720">Today to custom range</text>
    </g>
    <g transform="translate(472 145)">
      <circle cx="24" cy="24" r="22" fill="#CDEDE6"/>
      <path d="M14 24 L22 32 L36 16" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="62" y="33" font-size="25" font-weight="720">Skips already indexed</text>
    </g>
    <g transform="translate(44 202)">
      <circle cx="24" cy="24" r="22" fill="#CDEDE6"/>
      <path d="M14 24 L22 32 L36 16" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="62" y="33" font-size="25" font-weight="720">Classifies automatically</text>
    </g>
    <g transform="translate(472 202)">
      <circle cx="24" cy="24" r="22" fill="#CDEDE6"/>
      <path d="M14 24 L22 32 L36 16" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="62" y="33" font-size="25" font-weight="720">Ready for Ask</text>
    </g>
