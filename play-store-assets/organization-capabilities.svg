        <rect x="272" y="50" width="106" height="34" rx="17" fill="#CDEDE6"/>
        <text class="font teal" x="296" y="73" font-size="17" font-weight="720">Travel</text>
        <rect x="390" y="50" width="118" height="34" rx="17" fill="#CDEDE6"/>
        <text class="font teal" x="413" y="73" font-size="17" font-weight="720">Shopping</text>
        <rect x="0" y="98" width="104" height="34" rx="17" fill="#E7E2D8"/>
        <text class="font muted" x="27" y="121" font-size="17" font-weight="680">Food</text>
        <rect x="116" y="98" width="96" height="34" rx="17" fill="#E7E2D8"/>
        <text class="font muted" x="143" y="121" font-size="17" font-weight="680">Maps</text>
        <rect x="224" y="98" width="140" height="34" rx="17" fill="#E7E2D8"/>
        <text class="font muted" x="245" y="121" font-size="17" font-weight="680">Documents</text>
        <rect x="376" y="98" width="132" height="34" rx="17" fill="#E7E2D8"/>
        <text class="font muted" x="399" y="121" font-size="17" font-weight="680">Identity</text>
      </g>

      <g transform="translate(286 1286)">
        <rect width="508" height="98" rx="8" fill="#CDEDE6" opacity="0.62"/>
        <text class="font ink" x="20" y="38" font-size="23" font-weight="780">Embeddings make it searchable</text>
        <text class="font muted" x="20" y="70" font-size="19" font-weight="540">Text, visual signals, entities and categories</text>
      </g>
