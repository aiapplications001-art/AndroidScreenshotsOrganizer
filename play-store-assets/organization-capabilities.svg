    <path d="M862 931 C872 910 924 910 934 931" stroke="#176B62" stroke-width="7" stroke-linecap="round" fill="none"/>
    <text class="font muted" x="886" y="978" font-size="23" font-weight="720">Faces</text>

    <rect x="54" y="1062" width="196" height="92" rx="24" fill="#FFFCF6"/>
    <rect x="88" y="1088" width="70" height="48" rx="8" fill="#CDEDE6"/>
