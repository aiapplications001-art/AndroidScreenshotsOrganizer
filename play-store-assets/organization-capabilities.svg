<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Ask My Screenshots organization capabilities Play Store image</title>
  <desc id="desc">A Play Store promotional image showing how Ask My Screenshots organizes screenshot text, images, QR codes, barcodes, faces, entities, categories, and embeddings.</desc>
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif; }
      .ink { fill: #1F1F1C; }
      .muted { fill: #494641; }
      .teal { fill: #176B62; }
      .soft-teal { fill: #CDEDE6; }
      .surface { fill: #FFFCF6; }
      .band { fill: #F2EEE5; }
      .gold { fill: #6D5D2A; }
      .line { stroke: #176B62; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .soft-line { stroke: #7FAEA7; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .shadow { filter: drop-shadow(0 24px 42px rgba(31, 31, 28, 0.16)); }
      .small-shadow { filter: drop-shadow(0 10px 20px rgba(31, 31, 28, 0.10)); }
    </style>
    <linearGradient id="phoneInk" x1="250" y1="520" x2="830" y2="1430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F1F1C"/>
      <stop offset="1" stop-color="#0E4E48"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="254" y="560" width="572" height="840" rx="42"/>
    </clipPath>
  </defs>

  <rect width="1080" height="1920" fill="#F9F6EF"/>
  <rect x="0" y="0" width="1080" height="438" fill="#F2EEE5"/>
  <path d="M0 408 C160 466 328 480 510 444 C710 404 905 400 1080 454 L1080 0 L0 0 Z" fill="#F9F6EF"/>

  <g transform="translate(80 76)">
    <rect width="70" height="70" rx="18" fill="#176B62"/>
    <rect x="17" y="17" width="36" height="26" rx="5" fill="#F9F6EF"/>
    <rect x="23" y="50" width="20" height="5" rx="2" fill="#F9F6EF"/>
    <rect x="47" y="50" width="8" height="5" rx="2" fill="#F9F6EF"/>
    <rect x="23" y="25" width="24" height="4" rx="2" fill="#176B62"/>
    <rect x="23" y="34" width="16" height="4" rx="2" fill="#176B62"/>
    <text class="font ink" x="92" y="30" font-size="33" font-weight="760">Ask My Screenshots</text>
    <text class="font muted" x="92" y="63" font-size="24" font-weight="520">Local screenshot memory</text>
  </g>

  <g transform="translate(80 214)">
    <rect x="0" y="0" width="236" height="52" rx="26" fill="#CDEDE6"/>
    <circle cx="31" cy="26" r="12" fill="#176B62"/>
    <path d="M25 26 L30 31 L38 20" stroke="#FFFCF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text class="font teal" x="56" y="34" font-size="24" font-weight="760">Smart organization</text>
  </g>

  <text class="font ink" x="80" y="352" font-size="76" font-weight="820" letter-spacing="0">Every screenshot</text>
  <text class="font ink" x="80" y="432" font-size="76" font-weight="820" letter-spacing="0">becomes searchable.</text>
  <text class="font muted" x="80" y="500" font-size="30" font-weight="540">Text, images, QR codes, faces and mixed screenshots.</text>

