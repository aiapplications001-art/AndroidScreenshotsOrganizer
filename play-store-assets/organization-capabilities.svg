        <rect x="178" y="48" width="151" height="92" rx="8" fill="#FFFCF6"/>
        <text class="font ink" x="198" y="83" font-size="20" font-weight="780">Detect</text>
        <text class="font muted" x="198" y="112" font-size="16" font-weight="620">QR + faces</text>
        <rect x="357" y="48" width="151" height="92" rx="8" fill="#FFFCF6"/>
        <text class="font ink" x="377" y="83" font-size="20" font-weight="780">Understand</text>
