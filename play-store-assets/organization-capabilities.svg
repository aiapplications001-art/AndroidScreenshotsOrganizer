        <circle cx="48" cy="58" r="28" fill="#CDEDE6"/>
        <path d="M35 58 L45 68 L63 46" stroke="#176B62" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text class="font ink" x="92" y="45" font-size="25" font-weight="780">Organization done</text>
        <text class="font muted" x="92" y="78" font-size="20" font-weight="540">1,260 screenshots organized - 96 new</text>
        <text class="font muted" x="92" y="103" font-size="19" font-weight="540">1,164 already indexed - no rework</text>
      </g>

