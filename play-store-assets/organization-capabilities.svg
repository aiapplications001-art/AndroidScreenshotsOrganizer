    <text class="font ink" x="44" y="62" font-size="39" font-weight="790">Choose any time range.</text>
    <text class="font muted" x="44" y="107" font-size="26" font-weight="540">Update later and only new screenshots get added.</text>

    <g transform="translate(44 145)">
