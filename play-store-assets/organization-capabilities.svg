        <g transform="translate(20 62)">
          <rect x="0" y="0" width="92" height="34" rx="17" fill="#CDEDE6"/>
          <text class="font teal" x="18" y="23" font-size="17" font-weight="720">Today</text>
          <rect x="104" y="0" width="116" height="34" rx="17" fill="#E7E2D8"/>
          <text class="font muted" x="124" y="23" font-size="17" font-weight="680">Last 7 days</text>
          <rect x="232" y="0" width="126" height="34" rx="17" fill="#E7E2D8"/>
          <text class="font muted" x="252" y="23" font-size="17" font-weight="680">Last 30 days</text>
          <rect x="370" y="0" width="98" height="34" rx="17" fill="#E7E2D8"/>
          <text class="font muted" x="391" y="23" font-size="17" font-weight="680">Custom</text>
        </g>
        <rect x="20" y="118" width="468" height="42" rx="8" fill="#176B62"/>
        <text class="font surface" x="162" y="146" font-size="21" font-weight="760">Organize screenshots</text>
        <rect x="20" y="176" width="468" height="36" rx="8" fill="#FFFCF6" stroke="#C9C1B4" stroke-width="2"/>
        <text class="font muted" x="154" y="201" font-size="18" font-weight="680">Select images manually</text>
      </g>

      <g transform="translate(286 848)">
