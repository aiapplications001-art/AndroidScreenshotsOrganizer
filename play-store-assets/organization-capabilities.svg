    <text class="font muted" x="101" y="1186" font-size="23" font-weight="720">Mixed</text>

    <rect x="830" y="1062" width="196" height="92" rx="24" fill="#FFFCF6"/>
    <circle cx="890" cy="1108" r="18" fill="#CDEDE6"/>
    <circle cx="934" cy="1108" r="18" fill="#E7E2D8"/>
    <circle cx="978" cy="1108" r="18" fill="#CDEDE6"/>
    <text class="font muted" x="898" y="1186" font-size="23" font-weight="720">Entities</text>
