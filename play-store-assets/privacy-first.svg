      <rect x="556" y="873" width="96" height="10" rx="5" fill="#494641" opacity="0.24"/>
      <path d="M656 896 L681 920 H630 Z" fill="#176B62" opacity="0.82"/>

      <rect x="321" y="968" width="393" height="124" rx="24" fill="#E7E2D8" opacity="0.9"/>
      <rect x="349" y="1001" width="176" height="12" rx="6" fill="#176B62" opacity="0.72"/>
      <rect x="349" y="1032" width="294" height="10" rx="5" fill="#494641" opacity="0.26"/>
      <rect x="349" y="1058" width="240" height="10" rx="5" fill="#494641" opacity="0.22"/>

      <rect x="321" y="1123" width="182" height="134" rx="22" fill="#F2EEE5"/>
      <rect x="532" y="1123" width="182" height="134" rx="22" fill="#F2EEE5"/>
      <rect x="344" y="1150" width="102" height="12" rx="6" fill="#176B62" opacity="0.72"/>
      <rect x="344" y="1181" width="136" height="10" rx="5" fill="#494641" opacity="0.28"/>
      <rect x="556" y="1150" width="88" height="12" rx="6" fill="#6D5D2A" opacity="0.68"/>
      <rect x="556" y="1181" width="128" height="10" rx="5" fill="#494641" opacity="0.28"/>

      <rect x="429" y="865" width="222" height="222" rx="58" fill="#176B62"/>
      <path d="M486 950 V917 C486 887 508 865 540 865 C572 865 594 887 594 917 V950" stroke="#FFFCF6" stroke-width="26" stroke-linecap="round" fill="none"/>
      <rect x="463" y="934" width="154" height="111" rx="28" fill="#FFFCF6"/>
      <circle cx="540" cy="986" r="15" fill="#176B62"/>
      <rect x="533" y="996" width="14" height="24" rx="7" fill="#176B62"/>
    </g>

    <rect x="279" y="598" width="522" height="727" rx="42" stroke="#E7E2D8" stroke-width="2" fill="none"/>
  </g>

  <path class="line" d="M344 830 C284 824 251 799 232 760"/>
  <path class="line" d="M736 830 C796 824 829 799 848 760"/>
  <path class="line" d="M342 1076 C282 1075 244 1062 223 1039"/>
  <path class="line" d="M739 1076 C799 1075 839 1062 859 1039"/>

  <g transform="translate(80 1482)">
    <rect x="0" y="0" width="920" height="282" rx="44" fill="#FFFCF6" class="small-shadow"/>
    <text class="font ink" x="44" y="66" font-size="40" font-weight="790">Everything stays on-device.</text>
    <text class="font muted" x="44" y="112" font-size="26" font-weight="540">Your screenshot library is searched locally on your phone.</text>

    <g transform="translate(44 148)">
      <circle cx="25" cy="25" r="23" fill="#CDEDE6"/>
      <path d="M15 25 L23 33 L37 17" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="64" y="34" font-size="26" font-weight="720">No servers</text>
    </g>
    <g transform="translate(476 148)">
      <circle cx="25" cy="25" r="23" fill="#CDEDE6"/>
      <path d="M15 25 L23 33 L37 17" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="64" y="34" font-size="26" font-weight="720">No third parties</text>
    </g>
    <g transform="translate(44 214)">
      <circle cx="25" cy="25" r="23" fill="#CDEDE6"/>
      <path d="M15 25 L23 33 L37 17" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="64" y="34" font-size="26" font-weight="720">No cloud backups</text>
    </g>
    <g transform="translate(476 214)">
      <circle cx="25" cy="25" r="23" fill="#CDEDE6"/>
      <path d="M15 25 L23 33 L37 17" stroke="#176B62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text class="font ink" x="64" y="34" font-size="26" font-weight="720">No LLM uploads</text>
    </g>
  </g>

  <text class="font muted" x="540" y="1848" font-size="25" font-weight="560" text-anchor="middle">Ask your screenshots without uploading them.</text>
</svg>
